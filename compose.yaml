services:
  fakecloud:
    image: ghcr.io/faiscadev/fakecloud:v0.51.0
    container_name: fakecloud
    ports:
      - "4566:4566"
    environment:
      FAKECLOUD_STORAGE_MODE: "persistent"
      FAKECLOUD_DATA_PATH: "/var/lib/fakecloud"
      FAKECLOUD_ADDR: "0.0.0.0:4566"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./fakecloud_data:/var/lib/fakecloud
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "fakecloud", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
          
  stackport:
    image: davireis/stackport:0.4.5
    container_name: stackport
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://fakecloud:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    depends_on:
      fakecloud:
        condition: service_healthy
    volumes:
      - ./stackport_data:/root/.stackport 
    extra_hosts:
      - "host.docker.internal:host-gateway" 
